# Builds PairPaint and runs the test suite on Linux, Windows and macOS.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Windows: aqtinstall can't install Qt 6.12 there yet (miurahr/aqtinstall#1048).
          version: ${{ runner.os == 'Windows' && '6.11.*' || '6.12.*' }}
          modules: qtimageformats  # WebP, TIFF, and HEIC on macOS
          cache: true

      - name: Install libheif (HEIC photos)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libheif-dev libheif-plugin-libde265

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          # Linux (libheif) and macOS (Qt's plugin) must open the HEIC sample; Windows runners
          # have no HEIF codec, so there the test checks the message instead.
          PAIRPAINT_EXPECT_HEIF: ${{ runner.os != 'Windows' && '1' || '' }}
        run: ctest --test-dir build --build-config Release --output-on-failure

  # Memory errors and undefined behavior: the tests plus a short fuzzing run of the file
  # readers, built with AddressSanitizer and UndefinedBehaviorSanitizer.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*'
          cache: true

      - name: Install libheif (HEIC photos)
        run: sudo apt-get update && sudo apt-get install -y libheif-dev libheif-plugin-libde265

      - name: Build with sanitizers
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPAIRPAINT_SANITIZE=ON
          cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1:max_allocation_size_mb=4096
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

      - name: Fuzz the file readers
        env:
          # Impossible allocations fail like on a real system (and must be handled), instead of
          # ASan aborting the run.
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1:max_allocation_size_mb=4096
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          # A different random seed each run widens coverage; the seed is in the log to reproduce.
          echo "fuzz seed: ${{ github.run_number }}"
          build/tests/pairpaint_fuzz 3000 ${{ github.run_number }} tests/data/psd-tools/*.psd tests/data/fuzz/*.p* \
            tests/data/fuzz/*.heic

      - name: Keep the input that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure
          path: fuzz-*
