# Builds release downloads for Linux, Windows and macOS.
#
# - Pushing a tag like v0.1.0 builds everything and publishes it on a GitHub Release.
# - Running the workflow by hand (Actions tab > Release > Run workflow) only builds the
#   downloads, as artifacts on the run page, without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  linux:
    # Build on an older Ubuntu: the AppImage then also runs on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*'
          modules: qtimageformats  # WebP, TIFF and more
          cache: true

      - name: Version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || v="dev-${GITHUB_SHA::7}"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libwayland-dev

      # HEIC photos. Built from source rather than taken from Ubuntu 22.04, whose libheif is from
      # 2021: a recent decoder for files from the internet, and only the HEVC decoder (smaller).
      - name: Build libde265 and libheif
        run: |
          git clone --depth 1 --branch v1.1.3 https://github.com/strukturag/libde265.git
          cmake -S libde265 -B libde265/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SDL=OFF -DENABLE_ENCODER=OFF
          cmake --build libde265/build --parallel
          sudo cmake --install libde265/build
          git clone --depth 1 --branch v1.23.6 https://github.com/strukturag/libheif.git
          cmake -S libheif -B libheif/build -DCMAKE_BUILD_TYPE=Release -DENABLE_PLUGIN_LOADING=OFF \
            -DWITH_LIBDE265=ON -DWITH_X265=OFF -DWITH_X264=OFF -DWITH_OpenH264_DECODER=OFF \
            -DWITH_AOM_DECODER=OFF -DWITH_AOM_ENCODER=OFF -DWITH_DAV1D=OFF -DWITH_LIBSHARPYUV=OFF \
            -DWITH_EXAMPLES=OFF -DWITH_GDK_PIXBUF=OFF -DBUILD_TESTING=OFF -DBUILD_DOCUMENTATION=OFF
          cmake --build libheif/build --parallel
          sudo cmake --install libheif/build
          sudo ldconfig

      - name: Build
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DPAIRPAINT_BUILD_TESTS=OFF 2>&1 | tee configure.log
          grep -q "HEIC/HEIF support: libheif" configure.log  # never ship without it
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'  # the runner has no FUSE
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          # Include Wayland support next to X11, so the app runs natively on both.
          EXTRA_PLATFORM_PLUGINS: libqwayland.so
          EXTRA_QT_PLUGINS: wayland-decoration-client;wayland-graphics-integration-client;wayland-shell-integration
        run: |
          export OUTPUT="PairPaint-${VERSION}-x86_64.AppImage"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          ls AppDir/usr/plugins/imageformats
          ls AppDir/usr/lib | grep -E "libheif|libde265"

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: ./PairPaint-*.AppImage --version

      - uses: actions/upload-artifact@v7
        with:
          name: PairPaint-Linux
          path: PairPaint-*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'  # aqtinstall can't install Qt 6.12 on Windows yet (miurahr/aqtinstall#1048)
          modules: qtimageformats
          cache: true

      - name: Version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || v="dev-${GITHUB_SHA::7}"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S . -B build -DPAIRPAINT_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel

      - name: Collect the app and everything it needs
        shell: pwsh
        run: |
          $dist = "dist\PairPaint"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build\Release\pairpaint.exe $dist
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-compiler-runtime "$dist\pairpaint.exe"
          # Ship the Visual C++ runtime next to the exe, so users don't have to install it.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          Copy-Item "$($crt.FullName)\*.dll" $dist
          Copy-Item LICENSE "$dist\LICENSE.txt"
          Get-ChildItem "$dist\imageformats" | Select-Object -ExpandProperty Name

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -PassThru "dist\PairPaint\pairpaint.exe"
          Start-Sleep -Seconds 8
          $p.Refresh()
          Write-Host "Running: $(-not $p.HasExited)  window title: '$($p.MainWindowTitle)'"
          # A missing DLL makes Windows show a "System Error" box instead of the app.
          if ($p.HasExited -or $p.MainWindowTitle -match 'Error') { exit 1 }
          Stop-Process -Id $p.Id

      - name: Zip and installer
        shell: pwsh
        run: |
          Compress-Archive -Path dist\PairPaint -DestinationPath "PairPaint-$env:VERSION-windows-x64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\PairPaint" "/O$PWD" packaging\windows\pairpaint.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem PairPaint-*

      - uses: actions/upload-artifact@v7
        with:
          name: PairPaint-Windows
          path: |
            PairPaint-*-windows-x64.zip
            PairPaint-*-windows-x64-setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*'
          modules: qtimageformats
          cache: true

      - name: Version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || v="dev-${GITHUB_SHA::7}"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build (Apple Silicon + Intel)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPAIRPAINT_BUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --parallel

      - name: Bundle Qt into the app
        run: |
          app=build/PairPaint.app
          "$QT_ROOT_DIR/bin/macdeployqt" "$app"
          # Ad-hoc signature: required on Apple Silicon after macdeployqt edits the binaries.
          # (Not a Developer ID signature, so Gatekeeper still asks on first launch.)
          codesign --force --deep --sign - "$app"
          lipo -info "$app/Contents/MacOS/PairPaint"
          ls "$app/Contents/PlugIns/imageformats"
          ls "$app/Contents/PlugIns/imageformats" | grep -q macheif  # HEIC photos

      - name: Smoke test
        run: build/PairPaint.app/Contents/MacOS/PairPaint --version

      - name: Disk image
        run: |
          mkdir dmg
          cp -R build/PairPaint.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname PairPaint -srcfolder dmg -ov -format UDZO "PairPaint-${VERSION}-macos-universal.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: PairPaint-macOS
          path: PairPaint-*.dmg

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: downloads
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: downloads/*
          generate_release_notes: true
